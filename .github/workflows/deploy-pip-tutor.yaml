name: Deploy Pip tutor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-tutor-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'demukti/pip-web' && vars.PIP_TUTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:all
      - name: Build static game
        env:
          NEXT_PUBLIC_LIVE_STATE_URL: https://pip-live-state.tizav.workers.dev
        run: pnpm build
      - name: Deploy private state service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config live-state/wrangler.jsonc
      - name: Deploy static game
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PIP_PAGES_PROJECT: ${{ vars.PIP_PAGES_PROJECT }}
        run: |
          test -n "$PIP_PAGES_PROJECT"
          pnpm exec wrangler pages deploy out --project-name="$PIP_PAGES_PROJECT" --branch=main
