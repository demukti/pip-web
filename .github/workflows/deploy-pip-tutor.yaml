name: Deploy Pip tutor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-tutor-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'demukti/pip-web' && vars.PIP_TUTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full gate (`pnpm test:all`, ~11 minutes on a runner) is still run
      # locally before every push. These are the seconds-long checks that guard
      # this deploy: types, and the coach's own tests.
      - name: Type check
        run: pnpm test:types
      - name: Coach tests
        run: pnpm ava 'tests/askCoach*.test.ts'
      - name: Build static game
        env:
          NEXT_PUBLIC_ASK_COACH_URL: https://pip-live-state.tizav.workers.dev
          # Cross-device sync (docs/sync.md), from the fork's own Supabase
          # project. Repo Variables, not Secrets: both ship in the bundle. Left
          # unset, they build as empty and sync does not exist.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build
      # Once sync is wired, a build that lost it must not ship (the same check
      # as deploy-cloudflare-pages.yaml). Skipped while the variables are unset.
      - name: Assert the build has sync configured
        if: vars.NEXT_PUBLIC_SUPABASE_URL != ''
        run: pnpm test:sync-config
      - name: Deploy the coach service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config live-state/wrangler.jsonc
      - name: Deploy static game
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PIP_PAGES_PROJECT: ${{ vars.PIP_PAGES_PROJECT }}
        run: |
          test -n "$PIP_PAGES_PROJECT"
          pnpm exec wrangler pages deploy out --project-name="$PIP_PAGES_PROJECT" --branch=main
